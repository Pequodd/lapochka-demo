<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--white);font-family:var(--font-core);--page-margin:32px}@keyframes lp-spin{to{transform:rotate(360deg)}}@keyframes lp-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}.lp-marquee:hover>div{animation-play-state:paused}.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500);margin:16px 32px 6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Header, CartDrawer, Footer } = window.LapochkaDesignSystem_c28f60;
function Demo(){
  const [items,setItems]=React.useState([
    {id:"grape",name:"грейпфрут + лимон",price:149,quantity:2,pack:"330 мл"},
    {id:"tarhun",name:"тархун",price:139,quantity:6,pack:"6 банок"}]);
  return (<div>
    <p className="lbl">header · over hero (transparent)</p>
    <div style={{background:"var(--peach-400)",height:100,position:"relative",overflow:"hidden"}}><Header variant="transparent" cartCount={3} active="каталог"/></div>
    <p className="lbl">header · scrolled (blush-100 + elevation, 64px)</p>
    <div style={{height:84,position:"relative",overflow:"hidden"}}><Header scrolled cartCount={8} active="наборы"/></div>
    <p className="lbl">cart drawer · filled / empty</p>
    <div style={{position:"relative",height:420,display:"flex",gap:16,background:"var(--blush-100)",overflow:"hidden"}}>
      <div style={{position:"relative",flex:1}}><CartDrawer open items={items} onQuantityChange={(id,v)=>setItems(items.map(i=>i.id===id?{...i,quantity:v}:i))}/></div>
      <div style={{position:"relative",flex:1}}><CartDrawer open items={[]}/></div>
    </div>
    <p className="lbl">footer</p>
    <Footer/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
