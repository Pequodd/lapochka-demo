<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--white);font-family:var(--font-core);color:var(--ink-900)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden}.sw>div{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:10px;font-weight:600;letter-spacing:.04em}.sw>div span{opacity:.85;font-weight:500}.row{display:flex;gap:16px;align-items:flex-end}.t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--blush-200);border-radius:var(--radius-md);padding:14px"><div style="font-size:20px;font-weight:800;color:var(--coral-700)">классика</div><div style="font-size:11px;color:var(--ink-700);margin-top:4px">blush-200 / coral-700</div></div>
<div style="background:var(--retro-bg);border-radius:var(--radius-md);padding:14px"><div style="font-size:20px;font-weight:800;color:var(--retro-ink)">ретро</div><div style="font-size:11px;color:var(--retro-ink);margin-top:4px">#FBD6CE / #B0503F</div></div>
<div style="background:var(--water-bg);border-radius:var(--radius-md);padding:14px"><div style="font-size:20px;font-weight:800;color:var(--water-ink)">water</div><div style="font-size:11px;color:var(--water-ink);margin-top:4px">#DAEAF0 / #4E8CA8</div></div>
<div style="background:var(--collab-bg);border-radius:var(--radius-md);padding:14px"><div style="font-size:20px;font-weight:800;color:var(--collab-ink)">коллабы</div><div style="font-size:11px;color:var(--collab-ink);margin-top:4px">#D1C6E8 / #6A54A3</div></div>
</div>
</body></html>
