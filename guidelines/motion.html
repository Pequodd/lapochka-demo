<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--white);font-family:var(--font-core);color:var(--ink-900)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden}.sw>div{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:10px;font-weight:600;letter-spacing:.04em}.sw>div span{opacity:.85;font-weight:500}.row{display:flex;gap:16px;align-items:flex-end}.t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12px;color:var(--ink-700);line-height:1.5">
<div style="background:var(--blush-100);border-radius:var(--radius-md);padding:14px"><b style="font-size:20px;color:var(--coral-700)">120<span style="font-size:12px">ms</span></b><br>cubic-bezier(.4,0,.2,1)<br>colour, border</div>
<div style="background:var(--blush-100);border-radius:var(--radius-md);padding:14px"><b style="font-size:20px;color:var(--coral-700)">240<span style="font-size:12px">ms</span></b><br>cubic-bezier(.16,1,.3,1)<br>card lift, accordion, drawer</div>
<div style="background:var(--blush-100);border-radius:var(--radius-md);padding:14px"><b style="font-size:20px;color:var(--coral-700)">480<span style="font-size:12px">ms</span></b><br>section reveal on scroll</div>
<div style="background:var(--blush-100);border-radius:var(--radius-md);padding:14px"><b style="font-size:20px;color:var(--coral-700)">40s</b><br>marquee, linear, pauses on hover</div>
</div>
<div style="font-size:11px;color:var(--ink-500);margin-top:10px">every transition collapses under prefers-reduced-motion</div>
</body></html>
