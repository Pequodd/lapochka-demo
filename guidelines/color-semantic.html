<div class="sw"><div style="background:var(--ok);color:#fff">ok<span>#2E7D52 · скидка, экономия, бесплатная доставка</span></div><div style="background:var(--error);color:#fff">error<span>#C43A2B · ошибки форм</span></div><div style="background:var(--warning);color:var(--ink-900)">warning<span>#E8A317 · остатки на складе</span></div></div>
